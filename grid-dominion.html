<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Grid Dominion V2</title>
<style>
body { margin:0; background:#111; overflow:hidden; font-family:Arial; }
#ui {
 position:absolute;
 top:10px;
 left:10px;
 color:white;
}
#gameOver {
 position:absolute;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 color:white;
 display:none;
 text-align:center;
}
button {
 padding:10px 20px;
 border:none;
 background:cyan;
 cursor:pointer;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
Health: <span id="health">100</span>
Wave: <span id="wave">1</span>
</div>

<div id="gameOver">
<h1>Game Over</h1>
<button onclick="location.reload()">Restart</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

const TILE = 40;
const cols = Math.floor(canvas.width / TILE);
const rows = Math.floor(canvas.height / TILE);

let health = 100;
let wave = 1;
let enemies = [];
let gameRunning = true;

const player = {
 x: Math.floor(cols/2),
 y: Math.floor(rows/2)
};

function spawnWave() {
 enemies = [];
 for(let i=0;i<wave+2;i++){
  let ex, ey;
  do {
   ex = Math.floor(Math.random()*cols);
   ey = Math.floor(Math.random()*rows);
  } while(Math.abs(ex-player.x)<4 && Math.abs(ey-player.y)<4); // safe radius

  enemies.push({x:ex,y:ey});
 }
}
spawnWave();

document.addEventListener("keydown", e=>{
 if(!gameRunning) return;

 if(e.key==="ArrowUp" && player.y>0) player.y--;
 if(e.key==="ArrowDown" && player.y<rows-1) player.y++;
 if(e.key==="ArrowLeft" && player.x>0) player.x--;
 if(e.key==="ArrowRight" && player.x<cols-1) player.x++;
});

function moveEnemies(){
 if(!gameRunning) return;

 enemies.forEach(e=>{
  if(e.x < player.x) e.x++;
  else if(e.x > player.x) e.x--;

  if(e.y < player.y) e.y++;
  else if(e.y > player.y) e.y--;

  if(e.x===player.x && e.y===player.y){
   health -= 10;
   document.getElementById("health").innerText = health;
   if(health<=0){
    gameRunning=false;
    document.getElementById("gameOver").style.display="block";
   }
  }
 });

 if(enemies.length===0){
  wave++;
  document.getElementById("wave").innerText=wave;
  spawnWave();
 }
}

setInterval(moveEnemies, 400);

canvas.addEventListener("click", e=>{
 if(!gameRunning) return;

 const rect = canvas.getBoundingClientRect();
 const mx = Math.floor((e.clientX-rect.left)/TILE);
 const my = Math.floor((e.clientY-rect.top)/TILE);

 enemies = enemies.filter(e=>!(e.x===mx && e.y===my));
});

function drawGrid(){
 ctx.strokeStyle="#222";
 for(let x=0;x<cols;x++){
  for(let y=0;y<rows;y++){
   ctx.strokeRect(x*TILE,y*TILE,TILE,TILE);
  }
 }
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 drawGrid();

 ctx.fillStyle="cyan";
 ctx.fillRect(player.x*TILE,player.y*TILE,TILE,TILE);

 ctx.fillStyle="red";
 enemies.forEach(e=>{
  ctx.fillRect(e.x*TILE,e.y*TILE,TILE,TILE);
 });
}

function gameLoop(){
 draw();
 requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
