<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Ego Games</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0a0a0a;
  color: white;
  text-align: center;
}

h1 {
  margin-top: 60px;
  font-size: 50px;
  background: linear-gradient(90deg, cyan, magenta);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

#games {
  margin-top: 60px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 30px;
  padding: 20px;
}

.card {
  background: #111;
  padding: 25px;
  width: 280px;
  border-radius: 10px;
  box-shadow: 0 0 20px rgba(0,255,255,0.2);
}

.card h3 {
  margin: 0 0 15px;
  color: cyan;
}

.card a {
  display: inline-block;
  padding: 10px 20px;
  background: magenta;
  color: white;
  text-decoration: none;
  font-weight: bold;
  border-radius: 5px;
}

footer {
  margin-top: 80px;
  padding: 30px;
  opacity: 0.6;
}
</style>
</head>
<body>

<h1>AI EGO GAMES</h1>
<p>Auto-updating game repository powered by GitHub API</p>

<div id="games"></div>

<footer>
Live from GitHub Pages
</footer>

<script>
const username = "SatyaSingh-x11";
const repo = "Ai-ego-games";

const apiURL = `https://api.github.com/repos/${username}/${repo}/contents`;

fetch(apiURL)
  .then(res => res.json())
  .then(data => {
    const gamesDiv = document.getElementById("games");

    data.forEach(file => {

      // Show single HTML files
      if(file.type === "file" && file.name.endsWith(".html") && file.name !== "index.html"){
        createCard(file.name, file.name);
      }

      // Show folders that likely contain index.html
      if(file.type === "dir"){
        createCard(file.name, file.name + "/");
      }

    });

    function createCard(title, link){
      const card = document.createElement("div");
      card.className = "card";

      const h3 = document.createElement("h3");
      h3.innerText = title;

      const a = document.createElement("a");
      a.href = link;
      a.innerText = "Open";

      card.appendChild(h3);
      card.appendChild(a);
      gamesDiv.appendChild(card);
    }

  });
</script>

</body>
</html>
