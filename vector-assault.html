<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vector Assault Mobile</title>
<style>
body { margin:0; overflow:hidden; background:#0e0e0e; font-family:Arial;}
canvas { display:block; }
#ui {
 position:absolute;
 top:15px;
 left:15px;
 color:white;
 font-size:18px;
}
#gameOver {
 position:absolute;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 color:white;
 text-align:center;
 display:none;
}
button{
 padding:10px 20px;
 background:cyan;
 border:none;
 cursor:pointer;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
Health: <span id="health">100</span>
Score: <span id="score">0</span>
</div>

<div id="gameOver">
<h1>Game Over</h1>
<button onclick="location.reload()">Restart</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let lastTime = 0;
let health = 100;
let score = 0;
let running = true;

const player = {
 x: canvas.width/2,
 y: canvas.height/2,
 radius: 18,
 speed: 250,
 dx:0,
 dy:0
};

const enemies = [];
const bullets = [];

/* ---------- TOUCH CONTROL ---------- */
let touchActive = false;
let touchStart = {x:0,y:0};

canvas.addEventListener("touchstart", e=>{
 const t = e.touches[0];
 touchActive = true;
 touchStart.x = t.clientX;
 touchStart.y = t.clientY;
});

canvas.addEventListener("touchmove", e=>{
 if(!touchActive) return;
 const t = e.touches[0];
 const dx = t.clientX - touchStart.x;
 const dy = t.clientY - touchStart.y;

 const len = Math.hypot(dx,dy);
 if(len>10){
   player.dx = dx/len;
   player.dy = dy/len;
 }
});

canvas.addEventListener("touchend", ()=>{
 touchActive = false;
 player.dx = 0;
 player.dy = 0;
});

/* ---------- DESKTOP CONTROL ---------- */
const keys = {};
document.addEventListener("keydown", e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup", e=>keys[e.key.toLowerCase()]=false);

/* ---------- SHOOT ---------- */
canvas.addEventListener("click", e=>{
 bullets.push({
   x:player.x,
   y:player.y,
   dx:0,
   dy:-400
 });
});

/* ---------- ENEMY ---------- */
function spawnEnemy(){
 let x,y;
 do{
   x = Math.random()*canvas.width;
   y = Math.random()*canvas.height;
 } while(Math.hypot(x-player.x,y-player.y)<200);

 enemies.push({
   x,y,
   radius:15,
   speed:80
 });
}

setInterval(()=>{
 if(running) spawnEnemy();
},1500);

/* ---------- UPDATE ---------- */
function update(delta){
 if(!running) return;

 // desktop movement
 if(keys["w"]) player.y -= player.speed*delta;
 if(keys["s"]) player.y += player.speed*delta;
 if(keys["a"]) player.x -= player.speed*delta;
 if(keys["d"]) player.x += player.speed*delta;

 // touch movement
 player.x += player.dx * player.speed * delta;
 player.y += player.dy * player.speed * delta;

 // bounds
 player.x = Math.max(player.radius, Math.min(canvas.width-player.radius, player.x));
 player.y = Math.max(player.radius, Math.min(canvas.height-player.radius, player.y));

 // bullets
 bullets.forEach((b,i)=>{
   b.y += b.dy*delta;
   if(b.y<0) bullets.splice(i,1);
 });

 // enemies
 enemies.forEach((e,ei)=>{
   const angle = Math.atan2(player.y-e.y, player.x-e.x);
   e.x += Math.cos(angle)*e.speed*delta;
   e.y += Math.sin(angle)*e.speed*delta;

   // collision with player
   if(Math.hypot(player.x-e.x, player.y-e.y) < player.radius+e.radius){
     health -= 20;
     document.getElementById("health").innerText = health;
     enemies.splice(ei,1);
     if(health<=0){
       running=false;
       document.getElementById("gameOver").style.display="block";
     }
   }

   // bullet hit
   bullets.forEach((b,bi)=>{
     if(Math.hypot(b.x-e.x, b.y-e.y) < e.radius){
       enemies.splice(ei,1);
       bullets.splice(bi,1);
       score+=10;
       document.getElementById("score").innerText = score;
     }
   });
 });

 score += delta*5;
 document.getElementById("score").innerText = Math.floor(score);
}

/* ---------- DRAW ---------- */
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 // player
 ctx.beginPath();
 ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);
 ctx.fillStyle="cyan";
 ctx.fill();

 // enemies
 ctx.fillStyle="red";
 enemies.forEach(e=>{
   ctx.beginPath();
   ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);
   ctx.fill();
 });

 // bullets
 ctx.fillStyle="yellow";
 bullets.forEach(b=>{
   ctx.fillRect(b.x-2,b.y-10,4,10);
 });
}

/* ---------- LOOP ---------- */
function gameLoop(timestamp){
 const delta = (timestamp-lastTime)/1000;
 lastTime = timestamp;
 update(delta);
 draw();
 requestAnimationFrame(gameLoop);
}

spawnEnemy();
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
